<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>blogbot</title>
<style>
  body {
    width: 340px; margin: 0; padding: 16px;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    background: #f6f5f1; color: #2b2a26;
  }
  h1 { margin: 0 0 4px; font-size: 15px; }
  .sub { color: #8a877e; font-size: 11px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  label { font-size: 12px; color: #666; display: block; margin-bottom: 3px; }
  select, input[type=text] {
    font: inherit; width: 100%; padding: 6px 8px;
    border: 1px solid #e5e2da; border-radius: 6px; background: #fff;
  }
  button {
    font: inherit; width: 100%; padding: 10px; margin-top: 6px;
    background: #2f6b4f; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  #preview {
    display: block; padding: 8px 10px; margin-top: 8px;
    background: #e7f0eb; color: #2f6b4f; border-radius: 6px;
    text-align: center; text-decoration: none; font-size: 13px;
  }
  #log {
    margin-top: 10px; font-size: 11.5px; color: #555; line-height: 1.6;
    white-space: pre-wrap; max-height: 180px; overflow-y: auto;
  }
  .err { color: #b04a3a; }
  .info { color: #8a877e; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<h1>🌿 blogbot</h1>
<div class="sub">현재 페이지의 본문을 뽑아 한글 블로그 글로 만듭니다</div>

<div class="row">
  <div style="flex:1">
    <label>카테고리</label>
    <select id="cat">
      <option value="life">라이프</option>
      <option value="economy">경제</option>
      <option value="history">역사</option>
      <option value="tech">AI·테크</option>
      <option value="society">사회·문화</option>
    </select>
  </div>
  <div style="flex:1.6">
    <label>모델</label>
    <select id="model"></select>
  </div>
</div>

<div>
  <label>추가 요청 (선택)</label>
  <input type="text" id="note" placeholder="예: 제목에 커피 포함">
</div>

<button id="go">이 페이지로 블로그 글 만들기</button>
<a id="preview" href="#" target="_blank" style="display:none">미리보기 열기 ↗</a>
<div id="log"></div>
<div class="info">
  요구사항: 터미널에서 <code>python -m blogbot web</code> 실행 중이어야 합니다.
</div>

<script src="popup.js"></script>
</body>
</html>
